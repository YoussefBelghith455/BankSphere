
<div class="app-layout">

  @if (isMenuOpen) {
    <button
      type="button"
      class="sidebar-overlay"
      aria-label="Close navigation menu"
      (click)="toggleMenu()"
    ></button>
  }

  <div class="sidebar-container" [class.mobile-open]="isMenuOpen">
    <app-sidebar />
  </div>

  <div class="app-content">
    <app-mobile-header (menuToggle)="toggleMenu()" />

    <main class="main-content">
      <router-outlet />
    </main>
  </div>

</div>
